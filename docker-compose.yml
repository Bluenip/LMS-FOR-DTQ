services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms-local-password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lms -d lms']
      interval: 5s
      timeout: 5s
      retries: 10
  s3:
    build: ./docker/s3rver
    profiles: [storage]
    environment:
      S3_BUCKET: lms
    ports:
      - '127.0.0.1:9000:9000'
    volumes:
      - local_s3_data:/data
volumes:
  postgres_data:
  local_s3_data:
